<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試郵件 / Test Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #333333;
        }
        .content {
            font-size: 16px;
            color: #555555;
            line-height: 1.5;
        }
        .footer {
            font-size: 12px;
            color: #999999;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ API_TITLE }} 測試郵件</h1>
        </div>
        <div class="content">
            <p>您好，{{ username }}：</p>
            <p>這是一封測試郵件，目的是確認郵件系統是否正常運作。</p>
            <p>如果您收到此郵件，表示系統運作正常。</p>
            <p>測試時間(UTC+8)：{{ now().strftime('%Y-%m-%d %H:%M:%S') }}</p>
        </div>
        <div class="footer">
            &copy; {{ now().year }} {{ API_TITLE }}. 本郵件為系統自動發送，請勿直接回覆。
        </div>
    </div>
</body>
</html>

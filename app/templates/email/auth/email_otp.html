<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>您的驗證碼 / Verification Code</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #4CAF50;
            font-size: 24px;
        }
        .content {
            font-size: 16px;
            line-height: 1.8;
        }
        .content p {
            margin: 10px 0;
        }
        .otp-box {
            margin: 20px 0;
            text-align: center;
            font-size: 32px;
            letter-spacing: 6px;
            padding: 15px;
            background-color: #f3f3f3;
            border-radius: 6px;
            font-weight: bold;
            color: #333333;
            border: 1px solid #e0e0e0;
        }
        .footer {
            font-size: 12px;
            color: #777777;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>您的驗證碼</h1>
        </div>
        <div class="content">
            <p>親愛的 {{ username }} 您好：</p>
            <p>以下是您此次操作所需的驗證碼（OTP）。請在 <strong>{{ expire_minutes }}</strong> 分鐘內於系統中輸入完成驗證：</p>
            <div class="otp-box">
                {{ otp_code }}
            </div>
            <p>若您未請求此驗證碼，請忽略此郵件，但建議儘快檢查您的帳號安全。</p>
        </div>
        <div class="footer">
            &copy; {{ now().year }} {{ API_TITLE }}. 本郵件為系統自動發送，請勿回覆。
        </div>
    </div>
</body>
</html>

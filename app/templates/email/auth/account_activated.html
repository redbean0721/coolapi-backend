<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號啟用成功 / Account Activated</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #4CAF50;
            font-size: 24px;
        }
        .content {
            font-size: 16px;
            line-height: 1.8;
        }
        .content p {
            margin: 10px 0;
        }
        .button {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 30px;
            background-color: #4CAF50;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .footer {
            font-size: 12px;
            color: #777777;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>帳號啟用成功</h1>
        </div>
        <div class="content">
            <p>親愛的 {{ username }} 您好：</p>
            <p>恭喜您，您的帳號已成功啟用！您現在可以使用 {{ API_TITLE }} 的所有功能。</p>
            <p>如果您未曾進行此操作，請立即聯繫我們的客服團隊。</p>
            <p style="text-align: center;">
                <a class="button" href="{{ api_url }}/login">立即登入</a>
            </p>
            <p>祝您使用愉快！</p>
            <p>{{ API_TITLE }} 團隊敬上</p>
        </div>
        <div class="footer">
            &copy; {{ now().year }} {{ API_TITLE }}. 本郵件為系統自動發送，請勿回覆。
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號已刪除 / Account Deleted</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #FF5733;
            font-size: 24px;
        }
        .content {
            font-size: 16px;
            line-height: 1.8;
        }
        .content p {
            margin: 10px 0;
        }
        .footer {
            font-size: 12px;
            color: #777777;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>帳號已成功刪除</h1>
        </div>
        <div class="content">
            <p>親愛的 {{ username }} 您好：</p>
            <p>您的帳號已成功從 <strong>{{ API_TITLE }}</strong> 系統中永久刪除。</p>
            <p>所有關於您的個人資料、API Key、登入記錄與相關資料都已依照流程一併移除，且無法再進行還原。</p>
            <p>若您日後需要使用 {{ API_TITLE }}，歡迎隨時重新註冊。</p>
            <p>若本次刪除帳號操作非您本人進行，請立即聯繫我們。</p>
        </div>
        <div class="footer">
            &copy; {{ now().year }} {{ API_TITLE }}. 本郵件為系統自動發送，請勿回覆。
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>重設密碼 / Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        a.button {
            display: inline-block;
            padding: 12px 20px;
            margin-top: 20px;
            color: #fff;
            background-color: #007BFF;
            text-decoration: none;
            border-radius: 5px;
        }
        a.button:hover {
            background-color: #0056b3;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>重設密碼請求 / Password Reset Request</h2>
        <p>您好，{{ username }}，我們收到了您重設密碼的請求。</p>
        <p>請點擊以下按鈕重設您的密碼（此連結僅在 1 小時內有效）：</p>
        <a href="{{ reset_link }}" class="button">重設密碼 / Reset Password</a>
        <p>如果您沒有請求重設密碼，請忽略此郵件。</p>
        <div class="footer">
            &copy; {{ now().year }} {{ API_TITLE }}. 本郵件為系統自動發送，請勿直接回覆。
        </div>
    </div>
</body>
</html>

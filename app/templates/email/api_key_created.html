<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key 建立成功 / API Key Created</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #4CAF50;
            font-size: 24px;
        }
        .content {
            font-size: 16px;
            line-height: 1.8;
        }
        .content p {
            margin: 10px 0;
        }
        .footer {
            font-size: 12px;
            color: #777777;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>API Key 建立成功</h1>
        </div>
        <div class="content">
            <p>親愛的 {{ username }} 您好：</p>
            <p>您已成功建立新的 API Key：</p>
            <p>
                <strong>名稱：</strong>{{ key_name }}<br>
                <strong>描述：</strong>{{ description }}<br>
                <strong>建立時間：</strong>{{ time }}<br>
                <strong>授權：</strong>{{ permissions }}
            </p>
            <p>注意：API Key 僅會完整顯示一次，請務必妥善保存。</p>
        </div>
        <div class="footer">
            &copy; {{ now().year }} {{ API_TITLE }}. 本郵件為系統自動發送，請勿回覆。
        </div>
    </div>
</body>
</html>

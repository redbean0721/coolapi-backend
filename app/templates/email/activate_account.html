<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號啟用 / Activate Your Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
        }
        .header h1 {
            color: #333333;
        }
        .content {
            font-size: 16px;
            color: #555555;
            line-height: 1.5;
        }
        .button {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .footer {
            font-size: 12px;
            color: #999999;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ API_TITLE }} 帳號啟用</h1>
        </div>
        <div class="content">
            <p>您好，{{ username }}：</p>
            <p>感謝您註冊 {{ API_TITLE }}。請點擊下方按鈕啟用您的帳號：</p>
            <p>此連結僅在 24 小時內有效。</p>
            <p style="text-align:center;">
                <a class="button" href="{{ activation_link }}">啟用帳號 / Activate Account</a>
            </p>
            <p>如果您沒有註冊 {{ API_TITLE }}，請忽略此郵件。</p>
        </div>
        <div class="footer">
            &copy; {{ now().year }} {{ API_TITLE }}. 本郵件為系統自動發送，請勿直接回覆。
        </div>
    </div>
</body>
</html>
